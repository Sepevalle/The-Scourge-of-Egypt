name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Build browser game
        run: python -m pygbag --build --title "The Scourge of Egypt" main.py

      - name: Version game archive to avoid stale browser caches
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          web_dir = Path("build/web")
          source_archives = list(web_dir.glob("*.tar.gz"))
          if len(source_archives) != 1:
              raise RuntimeError("Expected exactly one Pygbag web archive")
          source_archive = source_archives[0]
          archive_name = (
              f"{source_archive.name[:-len('.tar.gz')]}-"
              f"{os.environ['BUILD_SHA'][:12]}.tar.gz"
          )
          shutil.copyfile(source_archive, web_dir / archive_name)

          index_file = web_dir / "index.html"
          html = index_file.read_text(encoding="utf-8")
          archive_reference = source_archive.name
          if html.count(archive_reference) != 1:
              raise RuntimeError("Unexpected Pygbag archive reference in index.html")
          index_file.write_text(
              html.replace(archive_reference, archive_name),
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
