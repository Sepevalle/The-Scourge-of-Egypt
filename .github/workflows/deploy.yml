name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          path: source/preview

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Build production game
        run: python -m pygbag --build --title "The Scourge of Egypt" main.py

      - name: Version production game archive
        run: python .github/scripts/version_web_archive.py .

      - name: Build staging game
        working-directory: source/preview
        run: python -m pygbag --build --title "The Scourge of Egypt - Preview" main.py

      - name: Version staging game archive
        run: python .github/scripts/version_web_archive.py source/preview

      - name: Assemble production and staging site
        run: |
          mkdir -p site/preview
          cp -a build/web/. site/
          cp -a source/preview/build/web/. site/preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
